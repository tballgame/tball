<!doctype html>
<html lang="zh-Hant">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>賽乒乓｜多人試用</title>
<style>
:root{font:16px/1.55 system-ui,sans-serif;color:#17312e;background:#eef4f1}
*{box-sizing:border-box}body{margin:0}header{background:#153d36;color:white;padding:1rem max(1rem,calc((100vw - 880px)/2))}
main{max-width:912px;margin:auto;padding:1rem}h1,h2,p{margin:.3rem 0 .75rem}
section,details{background:white;padding:1rem;margin-bottom:1rem;border:1px solid #cddcd5;border-radius:.7rem}
form{border-top:1px solid #dce5e1;padding:.7rem 0;margin-top:.7rem}label{display:block;margin:.45rem 0}
input,select,button{font:inherit;padding:.45rem .65rem;border:1px solid #859e94;border-radius:.35rem;max-width:100%}
button{background:#176450;color:white;cursor:pointer}button:disabled{opacity:.55;cursor:wait}
button.next-action{background:#1d4ed8;border-color:#1d4ed8;font-weight:700}
button.next-action:not(:disabled):hover{background:#1e40af}
button.next-action:focus-visible{outline:2px solid #1e40af;outline-offset:3px}
.next-action span{display:inline-block;margin-inline-end:.5rem;padding-inline-end:.5rem;border-inline-end:1px solid currentColor;font-size:.85em}
small{font-size:.7em}#status{color:#892c1d}summary{cursor:pointer;font-weight:700}
.guide-link{display:inline-block;color:white;text-underline-offset:.22em}
.board-link{color:#1e40af;text-underline-offset:.2em}
.board-mode #account{display:none}
.board-mode main{max-width:1600px;padding:1rem clamp(.75rem,3vw,3rem)}
.board-mode .board-heading h2{font-size:clamp(1.6rem,3vw,2.6rem)}
.board-mode .round-robin-matrix{font-size:clamp(1rem,1.5vw,1.5rem)}
.knockout-board{background:#0c1a18;color:#f3f8f6;border-color:#36534c}
.knockout-board h2{font-size:clamp(1.35rem,2.5vw,2rem);margin:0 0 .75rem}
.bracket-scroll{overflow-x:auto;padding-bottom:.5rem}
.bracket-grid{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(205px,1fr) clamp(2rem,5vw,5rem);min-width:max(100%,calc(var(--rounds) * 255px - 45px))}
.bracket-round h3{height:32px;margin:0;padding-left:.3rem;color:#b5ccc4;font-size:1.1rem}
.bracket-cards{height:var(--height);position:relative}
.bracket-slot{position:absolute;top:var(--y);transform:translateY(-50%);width:100%;z-index:1}
.bracket-wires{margin-top:32px;height:var(--height)}
.bracket-wires svg{display:block;width:100%;height:100%;overflow:visible}
.bracket-wires path{fill:none;stroke:#77c59b;stroke-width:2px;vector-effect:non-scaling-stroke}
.bracket-match,.bracket-bye{border:1px solid #547369;border-radius:.7rem;background:#182e29;overflow:hidden}
.bracket-match>small{display:block;padding:.25rem .8rem;color:#b5ccc4;border-bottom:1px solid #456057}
.bracket-final{border-color:#d3b568}
.bracket-team,.bracket-bye{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:.3rem .8rem;font-size:clamp(1.1rem,2vw,1.6rem);line-height:1.2}
.bracket-team span,.bracket-bye{overflow-wrap:anywhere}
.bracket-team strong{font-variant-numeric:tabular-nums}
.bracket-team+.bracket-team{border-top:1px solid #456057}
.bracket-winner{background:#214a38;color:#c0f9d0;font-weight:700}
.bracket-bye{border-style:dashed;color:#d3e4de}
.bracket-bye small{color:#b5ccc4;white-space:nowrap;font-size:.85rem}
.bracket-champion{max-width:24rem}
.bracket-champion{background:#392f1b;border:1px solid #d3b568;color:#ffe4a3;border-radius:.7rem;padding:.5rem .8rem;font-size:1.3rem}
.bracket-next{color:#c0f9d0;margin:.25rem 0 0}
#board-toolbar:not([hidden]){display:flex;align-items:center;flex-wrap:wrap;gap:.6rem 1rem;margin-bottom:.8rem}
.matrix-scroll{overflow-x:auto;margin:.5rem 0 1rem}
.round-robin-matrix{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.round-robin-matrix caption{text-align:left;font-weight:700;margin-bottom:.35rem}
.round-robin-matrix :is(th,td){border:1px solid #dce5e1;padding:.45rem .55rem;text-align:center;white-space:nowrap}
.round-robin-matrix thead th,.round-robin-matrix tfoot :is(th,td){background:#eef4f1}
.round-robin-matrix :is(thead,tbody,tfoot) tr > :first-child{position:sticky;left:0;background:#eef4f1}
.round-robin-matrix .matrix-self{background:#f5f7f6}
.round-robin-matrix .matrix-win{color:#9a4600;font-weight:700}
.round-robin-matrix .matrix-pending{color:#765000;background:#fff8e7;font-size:.875rem}
.assigned{color:#606b68}
.event-flow{padding-left:1.6rem}.event-flow summary[aria-current="step"]{color:#1e3a8a}
.current-step-label{display:inline-block;margin-inline-start:.35rem;padding:.1rem .4rem;border-radius:.3rem;background:#dbeafe;font-size:.8em}
.stage-toolbar{display:flex;justify-content:space-between;align-items:center;gap:.6rem;flex-wrap:wrap;margin:.85rem 0}
.stage-toolbar h3{margin:0}
#stage-feedback:empty{display:none}
.stage-panel > summary{overflow-wrap:anywhere}
.stage-panel[open] > summary{margin-bottom:.8rem}
.stage-status,.stage-progress{display:inline-block;margin:.15rem 0 .15rem .25rem;font-size:.875rem}
.stage-status{padding:.1rem .45rem;border-radius:.35rem}
.stage-status-done{background:#edf8f2;color:#14543c}
.stage-status-active{background:#dbeafe;color:#1e3a8a}
.stage-status-waiting{background:#fff8e7;color:#784e00}
.stage-has-disputes{border-color:#b42318}
.stage-status-dispute{background:#fff4f2;color:#912018}
.stage-schedule{border-bottom:1px solid #dce5e1;margin-bottom:1rem}
.workflow-notice,.lineup-card,.point-task{padding:.75rem 1rem;margin:.65rem 0;border-radius:.55rem;border:2px solid}
.match-result > summary{overflow-wrap:anywhere}
.match-result[open] > summary{margin-bottom:.75rem}
.match-needs-action{border-color:#b42318}
.match-needs-action > summary{color:#912018}
.remove-match{background:white;color:#912018;border-color:#b42318}
.editable-match{display:flex;flex-wrap:wrap;align-items:flex-start;gap:.5rem;margin-bottom:1rem}
.editable-match > details{flex:1 1 18rem;min-width:0;margin:0}
.editable-match > form{border:0;margin:0;padding:.55rem 0 0}
.editable-match > form > p:empty{display:none}
.team-group-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,11rem),1fr));gap:.25rem .75rem}
.team-group-fields select{width:100%}
.workflow-notice p{margin:.25rem 0 0}
.workflow-pending{border-color:#b42318;background:#fff4f2}
.workflow-pending > :is(strong,summary){color:#912018}
.workflow-waiting{border-color:#9a6700;background:#fff8e7}
.workflow-waiting > :is(strong,summary){color:#784e00}
.workflow-done{border-color:#28745a;background:#edf8f2}
.workflow-done > :is(strong,summary){color:#14543c}
.event-flow table{border-collapse:collapse}.event-flow th,.event-flow td{text-align:left;padding:.3rem .55rem;border-bottom:1px solid #dce5e1}
nav[aria-label="賽事分區"]{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:1rem}
nav button[aria-pressed="false"]{background:white;color:#176450}
.archive-delete{display:inline;border:0;padding:0;margin:0}
.archive-delete button{background:white;color:#892c1d;border-color:#aa7369}
.archive-delete [role="alert"]{color:#892c1d}
.archive-delete [role="alert"]:empty{display:none}
.registration-roster{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,12rem),1fr));gap:.25rem 1.5rem;padding-inline-start:1.4rem}
.registration-roster li{overflow-wrap:anywhere}
.team-roster{margin:.75rem 0 1rem}
.roster-captain{background:#eef4f1;border:1px solid #cddcd5;border-radius:.45rem;padding:.55rem .75rem;overflow-wrap:anywhere}
.roster-captain strong{margin-inline-end:.5rem}
.roster-members{padding:.25rem .75rem 0}
.roster-members ul{list-style:none;margin:.25rem 0 0;padding:0}
.roster-members li{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:.35rem .75rem;padding:.45rem 0;border-bottom:1px solid #dce5e1}
.roster-members li > span{overflow-wrap:anywhere}
.roster-members form{margin:0;padding:0;border:0}
.roster-members [role="alert"]{color:#892c1d;margin:.25rem 0 0}
.roster-members [role="alert"]:empty{display:none}
.member-role{display:inline-block;padding:.1rem .5rem;border-radius:.35rem;background:#fff0c2;color:#694400;font-size:.875em;font-weight:700}
.member-row{display:flex;align-items:flex-start;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem}
.member-row details{flex:1 1 15rem;margin:0}
.member-row form{margin:0;padding:0;border:0}
.member-row [role="alert"]:empty{display:none}
.member-row input[readonly]{display:block;width:100%;margin-top:.35rem}
</style>
<header><h1>賽乒乓 <small>v0.7.13</small></h1><p>跨日期團體賽</p><a class="guide-link" href="./guide.html">使用說明</a></header>
<main>
  <nav id="board-toolbar" aria-label="看板操作" hidden><a href="./">返回賽事首頁</a><button type="button">切換全螢幕</button><span>每 10 秒更新</span><span id="board-updated"></span></nav>
  <section id="account" aria-label="登入"><p id="identity">連線中…</p>
    <form id="login" hidden>
      <label>登入代號 <input name="username" type="password" autocomplete="current-password" required maxlength="40" autocapitalize="none"></label>
      <button value="login">登入</button>
      <button value="signup">註冊新會員</button>
      <p>新代號可用中英文、數字及 . _ -，至少 6 字元。註冊後自動取得會員編號，報名比賽時再填參賽名稱。</p>
      <p>登入代號就是登入憑證，請自行保管，並避免使用容易猜到的代號。</p>
      <p>此瀏覽器會保留登入狀態。共用裝置使用完畢後請登出。</p>
    </form>
    <details id="my-account" hidden><summary>我的帳號</summary>
      <p>我的登入代號 <span id="my-code"></span></p>
    </details>
    <button id="logout" hidden>登出</button>
    <button id="refresh" hidden>重新整理賽事</button>
  </section>
  <form id="reset-login" hidden>
    <h2>重設登入代號</h2>
    <label>新登入代號 <input name="code" type="password" autocomplete="new-password" required minlength="6" maxlength="40"></label>
    <button>儲存新代號</button>
    <a href="./">返回登入</a>
  </form>
  <p id="status" role="alert"></p>
  <div id="screen"></div>
</main>
<script type="module" src="./cloud-app.js?v=0.7.13"></script>
</html>
